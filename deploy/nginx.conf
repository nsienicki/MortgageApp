# nginx site for Homebuyer Market Lens.
# setup_server.sh replaces DOMAIN_NAME and installs this as /etc/nginx/sites-available/homebuyer-lens.
# Certbot then adds the HTTPS server block and the HTTP-to-HTTPS redirect.

# Per-visitor rate limits. CSV exports are the expensive requests, so they get the tightest limit.
limit_req_zone $binary_remote_addr zone=lens_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=lens_csv:10m rate=10r/m;

upstream homebuyer_lens_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_NAME www.DOMAIN_NAME;

    server_tokens off;
    client_max_body_size 1m;
    limit_req_status 429;

    # Static files straight from disk. File names aren't versioned, so keep the cache short.
    location /static/ {
        alias /opt/homebuyer-lens/app/static/;
        expires 1h;
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
        # Security headers come from the app; repeat the important one for files nginx serves itself.
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/api/tables/[^/]+/csv$ {
        limit_req zone=lens_csv burst=5 nodelay;
        proxy_pass http://homebuyer_lens_app;
        include /etc/nginx/snippets/homebuyer-lens-proxy.conf;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=lens_api burst=60 nodelay;
        proxy_pass http://homebuyer_lens_app;
        include /etc/nginx/snippets/homebuyer-lens-proxy.conf;
    }

    location / {
        proxy_pass http://homebuyer_lens_app;
        include /etc/nginx/snippets/homebuyer-lens-proxy.conf;
    }
}
